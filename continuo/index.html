<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1320">
<title>EMDR continuo · 60 minutos</title>
<style>
:root{--bg:#0c1320;--fg:#edf3fa;--muted:#9aaabb;--accent:#6fe3d1;--panel:#1c2a3c;--border:#455368;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
main{position:relative;width:100vw;height:100vh;height:100dvh;min-height:300px;isolation:isolate}
.stage{position:absolute;inset:0;overflow:hidden}
.ball{position:absolute;left:50%;top:50%;width:112px;height:112px;border-radius:50%;background:var(--accent);box-shadow:0 0 30px #6fe3d155;transform:translate(-50%,-50%);will-change:left;pointer-events:none}
.status{position:absolute;top:max(24px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:var(--muted);font-size:13px;letter-spacing:.06em;white-space:nowrap;text-align:center;opacity:.85}
.controls{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;transition:opacity .3s;z-index:3}
button,select{cursor:pointer;appearance:none;border:1px solid var(--border);border-radius:50px;background:var(--panel);color:var(--fg);padding:12px 16px;font:inherit;min-width:92px}
button.primary{background:var(--accent);color:#092123;border-color:var(--accent);font-weight:650}
button:focus-visible,select:focus-visible{outline:3px solid white;outline-offset:3px}
.controls.is-hidden{opacity:0;pointer-events:none}
.hint{position:absolute;bottom:7px;left:12px;font-size:11px;color:#8192a5;opacity:.6;z-index:2}
.brandmark{position:absolute;right:18px;bottom:18px;width:min(180px,24vw);height:auto;opacity:.88;pointer-events:none;user-select:none;z-index:1;line-height:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}.brandmark img{width:100%;height:auto}.brandmark .original-monogram{position:absolute;inset:0;clip-path:inset(0 72% 0 0)}
@media(max-width:700px){.brandmark{width:min(125px,30vw);right:14px;bottom:14px}}
@media(max-width:550px){.ball{width:92px;height:92px}.controls{gap:7px;flex-wrap:wrap;justify-content:center;width:min(96vw,490px)}button,select{font-size:13px;min-width:70px;padding:11px 12px}}
</style>
</head>

  <div class="hint">Espacio: pausar · R: reiniciar · Esc: salir de pantalla completa</div>
</main>
<script>
(() => {
  'use strict';
  const DURATION_MS = 60 * 60 * 1000;
  const MODES = {
    fast: { label: 'Rápida 1,7×', cyclesPerMs: 20.5 / 31000 },
    slow: { label: 'Lenta 0,8×', cyclesPerMs: 4 / (31000 * 4 / (12 * 0.8)) }
  };

  const ball = document.getElementById('ball');
  const stage = document.getElementById('stage');
  const status = document.getElementById('status');
  const controls = document.getElementById('controls');
  const mode = document.getElementById('mode');
  const play = document.getElementById('play');
  const reset = document.getElementById('reset');
  const fullscreen = document.getElementById('fullscreen');

  let config = MODES.fast;
  let elapsed = 0;
  let startedAt = 0;
  let running = false;
  let completed = false;
  let raf = 0;
  let hideTimeout = 0;

  const total = () => DURATION_MS;

  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function draw() {
    const safeWidth = Math.max(0, stage.clientWidth - ball.offsetWidth - 28);
    const normalizedX = completed ? 0 : Math.sin(2 * Math.PI * config.cyclesPerMs * elapsed);
    ball.style.left = (stage.clientWidth / 2 + normalizedX * safeWidth / 2) + 'px';
    status.textContent = completed
      ? 'Sesión terminada · ' + config.label
      : config.label + ' · ' + (running ? 'Movimiento continuo' : 'En pausa') + ' · ' + fmt(total() - elapsed) + ' restantes';
  }

  function showControls() {
    controls.classList.remove('is-hidden');
    clearTimeout(hideTimeout);
  }

  function armAutoHide() {
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      if (running) controls.classList.add('is-hidden');
    }, 2200);
  }

  function frame(t) {
    if (!running) return;
    elapsed = Math.min(total(), t - startedAt);
    completed = elapsed >= total();
    draw();
    if (completed) {
      running = false;
      play.textContent = 'Repetir';
      showControls();
      return;
    }
    raf = requestAnimationFrame(frame);
  }

  function toggle() {
    if (running) {
      elapsed = Math.min(total(), performance.now() - startedAt);
      running = false;
      cancelAnimationFrame(raf);
      play.textContent = 'Continuar';
      showControls();
      draw();
      return;
    }
    if (completed) {
      elapsed = 0;
      completed = false;
    }
    running = true;
    startedAt = performance.now() - elapsed;
    play.textContent = 'Pausar';
    draw();
    armAutoHide();
    raf = requestAnimationFrame(frame);
  }

  function doReset() {
    running = false;
    completed = false;
    elapsed = 0;
    cancelAnimationFrame(raf);
    play.textContent = 'Iniciar';
    showControls();
    draw();
  }

  mode.addEventListener('change', () => {
    config = MODES[mode.value];
    doReset();
  });
  play.addEventListener('click', toggle);
  reset.addEventListener('click', doReset);
  fullscreen.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (e) {
      showControls();
    }
  });

  document.addEventListener('fullscreenchange', () => {
    fullscreen.textContent = document.fullscreenElement ? 'Salir de pantalla' : 'Pantalla completa';
  });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat) {
      e.preventDefault();
      toggle();
    }
    if (e.code === 'KeyR' && !e.repeat && !e.ctrlKey && !e.metaKey) {
      doReset();
    }
  });
  window.addEventListener('pointermove', () => {
    if (running) {
      showControls();
      armAutoHide();
    }
  });
  stage.addEventListener('pointerdown', () => {
    if (running) showControls();
  });
  window.addEventListener('resize', draw);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && running) toggle();
  });

  draw();
})();
</script>
