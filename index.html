<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1320">
<title>EMDR · Estimulación visual</title>
<style>
:root{color-scheme:dark;--bg:#0c1320;--fg:#edf3fa;--muted:#9aaabb;--accent:#6fe3d1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
main{position:relative;width:100vw;height:100vh;height:100dvh;min-height:300px;isolation:isolate}
.stage{position:absolute;inset:0;overflow:hidden}
.ball{position:absolute;left:50%;top:50%;width:112px;height:112px;border-radius:50%;background:var(--accent);box-shadow:0 0 30px #6fe3d155;transform:translate(-50%,-50%);will-change:left;pointer-events:none}
.status{position:absolute;top:max(24px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:var(--muted);font-size:13px;letter-spacing:.06em;white-space:nowrap;text-align:center;opacity:.8}
.controls{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;transition:opacity .3s;z-index:2}
button{cursor:pointer;appearance:none;border:1px solid #455368;border-radius:50px;background:#1c2a3c;color:var(--fg);padding:12px 20px;font:inherit;min-width:92px}
button.primary{background:var(--accent);color:#092123;border-color:var(--accent);font-weight:650}
button:focus-visible{outline:3px solid white;outline-offset:3px}
.controls.is-hidden{opacity:0;pointer-events:none}
.hint{position:absolute;bottom:7px;right:12px;font-size:11px;color:#8192a5;opacity:.6}
@media(max-width:550px){.ball{width:92px;height:92px}.controls{gap:7px}button{font-size:13px;min-width:70px;padding:11px 12px}}
</style>
</head>
<body>
<main id="app">
<div class="stage" id="stage" aria-label="Área de seguimiento visual"><div class="ball" id="ball"></div></div>
<div class="status" id="status" role="status" aria-live="off">Listo · 13 series · 9:58</div>
<div class="controls" id="controls">
<button class="primary" id="play">Iniciar</button>
<button id="reset">Reiniciar</button>
<button id="fullscreen" title="Pantalla completa">Pantalla completa</button>
</div>
<div class="hint">Espacio: pausar · Esc: salir de pantalla completa</div>
</main>
<script>
(() => {
'use strict';
const MOVE_MS=31000, REST_MS=15000, SETS=13, ROUND_TRIPS=12;
const ball=document.getElementById('ball'),stage=document.getElementById('stage'),status=document.getElementById('status'),controls=document.getElementById('controls'),play=document.getElementById('play'),reset=document.getElementById('reset'),fullscreen=document.getElementById('fullscreen');
let elapsed=0,startedAt=0,running=false,completed=false,raf=0,hideTimeout=0;
const total=SETS*(MOVE_MS+REST_MS);
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function draw(){
 const safeWidth=Math.max(0,stage.clientWidth-ball.offsetWidth-28);
 const cycleIndex=Math.min(SETS-1,Math.floor(elapsed/(MOVE_MS+REST_MS)));
 const within=elapsed-cycleIndex*(MOVE_MS+REST_MS);
 const moving=!completed&&within<MOVE_MS;
 const progress=moving?Math.min(1,within/MOVE_MS):0;
 const normalizedX=moving?Math.sin(2*Math.PI*ROUND_TRIPS*progress):0;
 ball.style.left=(stage.clientWidth/2+normalizedX*safeWidth/2)+'px';
 status.textContent=completed?'Ejercicio terminado · 9:58':'Serie '+(cycleIndex+1)+'/'+SETS+' · '+(moving?'Movimiento':'Pausa central')+' · '+fmt(total-elapsed)+' restantes';
}
function showControls(){controls.classList.remove('is-hidden');clearTimeout(hideTimeout)}
function frame(t){
 if(!running)return;
 elapsed=Math.min(total,t-startedAt);completed=elapsed>=total;draw();
 if(completed){running=false;play.textContent='Repetir';showControls();return}
 raf=requestAnimationFrame(frame);
}
function toggle(){
 if(running){elapsed=Math.min(total,performance.now()-startedAt);running=false;cancelAnimationFrame(raf);play.textContent='Continuar';showControls();draw();return}
 if(completed){elapsed=0;completed=false}
 running=true;startedAt=performance.now()-elapsed;play.textContent='Pausar';
 clearTimeout(hideTimeout);hideTimeout=setTimeout(()=>{if(running)controls.classList.add('is-hidden')},2500);
 raf=requestAnimationFrame(frame);
}
play.addEventListener('click',toggle);
reset.addEventListener('click',()=>{running=false;completed=false;elapsed=0;cancelAnimationFrame(raf);play.textContent='Iniciar';showControls();draw()});
fullscreen.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){showControls()}});
document.addEventListener('fullscreenchange',()=>fullscreen.textContent=document.fullscreenElement?'Salir de pantalla':'Pantalla completa');
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();toggle()}if(e.code==='KeyR'&&!e.repeat&&!e.ctrlKey&&!e.metaKey)reset.click()});
window.addEventListener('pointermove',()=>{if(running){showControls();hideTimeout=setTimeout(()=>{if(running)controls.classList.add('is-hidden')},2000)}});
stage.addEventListener('pointerdown',()=>{if(running)showControls()});
window.addEventListener('resize',draw);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)toggle()});
draw();
})();
</script>
</body>
</html>
